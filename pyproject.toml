[project]
name = "cognigraph"
version = "0.1.0"
description = "Human-like cognitive agent with a learned graph (nervous system) and LLM (brain) fallback"
readme = "README.md"
authors = [
    { name = "Ibrahim Bayer" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "sentence-transformers>=3.4.0",
    "faiss-cpu>=1.9.0",
    "numpy>=1.26.0",
]

[project.scripts]
cognigraph = "cognigraph.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["cognigraph"]

[tool.coverage.report]
show_missing = true
